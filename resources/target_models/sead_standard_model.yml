    unique_sets:
      - [system_name]
      - [taxonomic_order_system_uuid]

  taxonomic_order:
    role: fact
    required: false
    description: Taxonomic ordering code assigned to a taxon under a named order system.
    aggregate_parent: taxa
    domains: [taxonomy]
    target_table: tbl_taxonomic_order
    public_id: taxonomic_order_id
    columns:
      taxon_id:
        required: true
        type: integer
        nullable: false
      taxonomic_order_system_id:
        required: true
        type: integer
        nullable: false
      taxonomic_code:
        required: true
        type: decimal
        nullable: true
    unique_sets:
      - [taxon_id, taxonomic_order_system_id, taxonomic_code]
    foreign_keys:
      - entity: taxa
        required: true
      - entity: taxonomic_order_system
        required: true

  taxonomic_order_biblio:
    role: bridge
    required: false
    description: Bibliographic references associated with taxonomic order systems.
    domains: [taxonomy]
    target_table: tbl_taxonomic_order_biblio
    public_id: taxonomic_order_biblio_id
    unique_sets:
      - [biblio_id, taxonomic_order_system_id]
    columns:
      biblio_id:
        type: integer
        nullable: true
      taxonomic_order_system_id:
        type: integer
        nullable: true
    foreign_keys:
      - entity: citation
        required: false
      - entity: taxonomic_order_system
        required: false

  # PHASE 1 ADDITIONS - Dating Domain

  season_type:
    role: classifier
    required: false
    description: Controlled vocabulary for the kind of season a seasonal observation refers to.
    domains: [dating]
    target_table: tbl_season_types
    public_id: season_type_id
    columns:
      season_type:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
    unique_sets:
      - [season_type]

  season:
    role: classifier
    required: false
    description: Named season referenced by dating ranges and seasonality observations.
    domains: [dating]
    target_table: tbl_seasons
    public_id: season_id
    unique_sets:
      - [season_name]
    columns:
      season_name:
        type: string
        nullable: true
      season_type:
        type: string
        nullable: true
      season_type_id:
        type: integer
        nullable: true
      sort_order:
        type: integer
        nullable: true
    foreign_keys:
      - entity: season_type
        required_when:
          has_new_rows: season

  age_type:
    role: classifier
    required: false
    description: Chronological notation system (AD, BC, BP, cal BP)
    domains: [dating]
    target_table: tbl_age_types
    public_id: age_type_id
    columns:
      age_type:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
    unique_sets:
      - [age_type]

  relative_age_type:
    role: classifier
    required: false
    description: Type of relative age system (archaeological period, geological epoch)
    domains: [dating]
    target_table: tbl_relative_age_types
    public_id: relative_age_type_id
    columns:
      age_type:
        required: true
        type: string
        nullable: true
      description:
        type: string
        nullable: true
    unique_sets:
      - [age_type]

  chronology:
    role: lookup
    required: false
    description: Chronological framework built from dated samples.
    domains: [dating]
    target_table: tbl_chronologies
    public_id: chronology_id
    columns:
      chronology_name:
        required: true
        type: string
        nullable: false
      age_model:
        type: string
        nullable: true
      relative_age_type_id:
        type: integer
        nullable: true
      contact_id:
        type: integer
        nullable: true
      date_prepared:
        type: date
        nullable: true
      notes:
        type: string
        nullable: true
    unique_sets:
      - [chronology_name]
    foreign_keys:
      - entity: relative_age_type
        required: false
      - entity: contact
        required: false

  dating_uncertainty:
    role: classifier
    required: false
    description: Uncertainty qualifiers for dating results
    domains: [dating]
    target_table: tbl_dating_uncertainty
    public_id: dating_uncertainty_id
    columns:
      uncertainty:
        required: true
        type: string
        nullable: false
    unique_sets:
      - [uncertainty]

  dating_material:
    role: lookup
    required: false
    description: Material dated in geochronological analysis
    domains: [dating]
    target_table: tbl_dating_material
    public_id: dating_material_id
    columns:
      geochron_id:
        required: true
        type: integer
        nullable: false
      taxon_id:
        type: integer
        nullable: true
      material_dated:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
      abundance_element_id:
        type: integer
        nullable: true
    unique_sets:
      - [material_dated]
    foreign_keys:
      - entity: geochronology
        required: true
      - entity: taxa
        required: false
      - entity: abundance_element
        required: false

  relative_ages:
    role: lookup
    required: false
    description: Controlled relative-age vocabulary used by archaeological dating records.
    domains: [dating]
    target_table: tbl_relative_ages
    public_id: relative_age_id
    unique_sets:
      - [relative_age_name]
    columns:
      relative_age_name:
        required: true
        type: string
        nullable: true
      relative_age_type_id:
        type: integer
        nullable: true
      description:
        type: string
        nullable: true
      c14_age_older:
        type: decimal
        nullable: true
      c14_age_younger:
        type: decimal
        nullable: true
      cal_age_older:
        type: decimal
        nullable: true
      cal_age_younger:
        type: decimal
        nullable: true
      notes:
        type: string
        nullable: true
      location_id:
        type: integer
        nullable: true
      abbreviation:
        type: string
        nullable: true
    foreign_keys:
      - entity: relative_age_type
        required: false
      - entity: location
        required: false

  relative_age_reference:
    role: bridge
    required: false
    description: Citation associated with a relative-age record.
    aggregate_parent: relative_ages
    domains: [dating, provenance, bibliography]
    target_table: tbl_relative_age_refs
    public_id: relative_age_ref_id
    unique_sets:
      - [relative_age_id, biblio_id]
    columns:
      biblio_id:
        required: true
        type: integer
        nullable: false
      relative_age_id:
        required: true
        type: integer
        nullable: false
    foreign_keys:
      - entity: citation
        required_when:
          has_new_rows: relative_age_reference
      - entity: relative_ages
        required_when:
          has_new_rows: relative_age_reference

  relative_dating:
    role: fact
    required: false
    description: Relative or archaeological dating observation linked to an analysis entity and optionally to a relative
      age vocabulary entry; Arbodat archaeological dating facts map here.
    aggregate_parent: analysis_entity
    domains: [dating]
    target_table: tbl_relative_dates
    public_id: relative_date_id
    unique_sets:
      - [analysis_entity_id, relative_age_id]
    columns:
      analysis_entity_id:
        required: true
        type: integer
        nullable: false
      relative_age_id:
        required: true
        type: integer
        nullable: true
      method_id:
        type: integer
        nullable: true
      notes:
        type: string
        nullable: true
      dating_uncertainty_id:
        type: integer
        nullable: true
    foreign_keys:
      - entity: analysis_entity
        required: true
      - entity: relative_ages
        required: false
      - entity: method
        required: false
      - entity: dating_uncertainty
        required: false

  geochronology:
    role: fact
    required: false
    description: Absolute or chronology dating observation linked to an analysis entity and optionally to a dating 
      laboratory; Arbodat chronology/lab dating facts map here even when the project-local entity is named `dating`.
    aggregate_parent: analysis_entity
    domains: [dating]
    target_table: tbl_geochronology
    public_id: geochron_id
    unique_sets:
      - [analysis_entity_id, lab_number]
    columns:
      analysis_entity_id:
        required: true
        type: integer
        nullable: false
      dating_lab_id:
        type: integer
        nullable: true
      lab_number:
        required: true
        type: string
        nullable: true
      age:
        type: decimal
        nullable: true
      error_older:
        type: decimal
        nullable: true
      error_younger:
        type: decimal
        nullable: true
      delta_13c:
        type: decimal
        nullable: true
      notes:
        type: string
        nullable: true
      dating_uncertainty_id:
        type: integer
        nullable: true
    foreign_keys:
      - entity: analysis_entity
        required: true
      - entity: dating_lab
        required: false
      - entity: dating_uncertainty
        required: false

  geochron_reference:
    role: bridge
    required: false
    description: Citation associated with a geochronology record.
    aggregate_parent: geochronology
    domains: [dating, provenance, bibliography]
    target_table: tbl_geochron_refs
    public_id: geochron_ref_id
    unique_sets:
      - [geochron_id, biblio_id]
    columns:
      geochron_id:
        required: true
        type: integer
        nullable: false
      biblio_id:
        required: true
        type: integer
        nullable: false
    foreign_keys:
      - entity: geochronology
        required_when:
          has_new_rows: geochron_reference
      - entity: citation
        required_when:
          has_new_rows: geochron_reference

  dating_lab:
    role: lookup
    required: false
    description: Laboratory metadata for dated samples and geochronology results.
    domains: [dating]
    target_table: tbl_dating_labs
    public_id: dating_lab_id
    unique_sets:
      - [international_lab_id]
    columns:
      international_lab_id:
        required: true
        type: string
        nullable: false
      lab_name:
        type: string
        nullable: true
      contact_id:
        type: integer
        nullable: true
      country_id:
        type: integer
        nullable: true
    foreign_keys:
      - entity: contact
        required: false

  method_group:
    role: classifier
    required: false
    description: Controlled grouping for analytical and collection methods.
    domains: [core, contacts]
    target_table: tbl_method_groups
    public_id: method_group_id
    columns:
      group_name:
        required: true
        type: string
        nullable: false
      description:
        required: true
        type: string
        nullable: false
    unique_sets:
      - [group_name]

  contact:
    role: lookup
    required: true
    description: Person or organization contact metadata used by datasets, projects, and dating laboratories.
    reconciliation: lookup-only
    domains: [contacts]
    target_table: tbl_contacts
    public_id: contact_id
    columns:
      first_name:
        type: string
        nullable: true
      last_name:
        type: string
        nullable: true
      email:
        type: string
        nullable: true
      phone_number:
        type: string
        nullable: true
      address_1:
        type: string
        nullable: true
      address_2:
        type: string
        nullable: true
      location_id:
        type: integer
        nullable: true
      url:
        type: string
        nullable: true

    unique_sets: []
  contact_type:
    role: classifier
    required: false
