        type: string
        nullable: true
    unique_sets:
      - [data_type_name]
    foreign_keys:
      - entity: data_type_group
        required_when:
          has_new_rows: data_type

  unit:
    role: classifier
    required: false
    description: Unit of measurement referenced by dimensions, methods, and analytical values.
    domains: [core]
    target_table: tbl_units
    public_id: unit_id
    columns:
      unit_name:
        required: true
        type: string
        nullable: false
      unit_abbrev:
        type: string
        nullable: true
      description:
        type: string
        nullable: true
    unique_sets:
      - [unit_name]
      - [unit_abbrev]

naming:
  public_id_suffix: _id

constraints:
  - type: no_orphan_facts
  - type: no_circular_dependencies
