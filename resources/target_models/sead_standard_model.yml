    unique_sets:
      - [dataset_id, contact_id, contact_type_id, event_date]
    columns:
      dataset_id:
        required: true
        type: integer
        nullable: false
      contact_id:
        required: true
        type: integer
        nullable: false
      contact_type_id:
        required: true
        type: integer
        nullable: false
      event_date:
        required: true
        type: date
        nullable: true
    foreign_keys:
      - entity: dataset
        required: true
      - entity: contact
        required: true
      - entity: contact_type
        required: true

  feature_type:
    role: classifier
    required: false
    description: Controlled vocabulary for archaeological feature classification.
    domains: [core, excavation]
    target_table: tbl_feature_types
    public_id: feature_type_id
    columns:
      feature_type_name:
        required: true
        type: string
        nullable: true
      feature_type_description:
        type: string
        nullable: true
    unique_sets:
      - [feature_type_name]

  feature:
    role: lookup
    required: false
    description: Archaeological feature or excavation context referenced by samples and site workflows.
    domains: [core, excavation]
    target_table: tbl_features
