model:
  name: SEAD Clearinghouse Extended
  format_version: "1"
  version: 2.8.0
  description: SEAD archaeological research data model with enhanced spatial, dating, and metadata coverage

entities:
  location:
    role: lookup
    required: true
    description: Geographic location referenced by sites and other context entities.
    domains: [core, spatial]
    target_table: tbl_locations
    public_id: location_id
    columns:
      location_name:
        required: true
        type: string
        nullable: false
      location_type_id:
        type: integer
        nullable: false
      default_lat_dd:
        type: decimal
        nullable: true
      default_long_dd:
        type: decimal
        nullable: true
    unique_sets:
      - [location_type_id, location_name]
    foreign_keys:
      - entity: location_type
        required_when:
          has_new_rows: location

  location_type:
    role: classifier
    required: false
    description: Controlled vocabulary for location classification.
    domains: [core, spatial]
    target_table: tbl_location_types
    public_id: location_type_id
    columns:
      location_type:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
    unique_sets:
      - [location_type]

  site:
    role: lookup
    required: true
    description: Archaeological site anchored to a location.
    domains: [core, spatial]
    target_table: tbl_sites
    public_id: site_id
    unique_sets:
      - [site_name]
    columns:
      site_name:
        required: true
        type: string
        nullable: false
      national_site_identifier:
        type: string
        nullable: true
      site_description:
        type: string
        nullable: true
      latitude_dd:
        type: decimal
        nullable: true
      longitude_dd:
        type: decimal
        nullable: true
      altitude:
        type: decimal
        nullable: true
      site_preservation_status_id:
        type: integer
        nullable: true
    foreign_keys:
      - entity: location
        required: true
        via: site_location
      - entity: site_type
        required: false
        via: site_site_type
      - entity: site_preservation_status
        required: false

  site_reference:
    role: bridge
    required: false
    description: Citation associated with a site.
    domains: [spatial, provenance, bibliography]
    target_table: tbl_site_references
    public_id: site_reference_id
    unique_sets:
      - [site_id, biblio_id]
    columns:
      site_id:
        type: integer
        nullable: true
      biblio_id:
        required: true
        type: integer
        nullable: false
    foreign_keys:
      - entity: site
        required: false
      - entity: citation
        required_when:
          has_new_rows: site_reference

  site_other_record:
    role: fact
    required: false
    description: Other record associated with a site.
    domains: [spatial, provenance]
    target_table: tbl_site_other_records
    public_id: site_other_records_id
    unique_sets:
      - [site_other_records_uuid]
    columns:
      site_id:
        type: integer
        nullable: true
      biblio_id:
        type: integer
        nullable: true
      record_type_id:
        type: integer
        nullable: true
      description:
        type: string
        nullable: true
      site_other_records_uuid:
        required: true
        type: uuid
        nullable: false
    foreign_keys:
      - entity: site
        required: false
      - entity: citation
        required: false
      - entity: record_type
        required: false

  site_location:
    role: bridge
    required: true
    description: Join entity connecting sites to locations, allowing for many-to-many relationships between the two.
    domains: [core, spatial]
    target_table: tbl_site_locations
    public_id: site_location_id
    unique_sets:
      - [site_id, location_id]
    columns:
      site_location_id:
        required: true
        generated: true
        type: integer
        nullable: false
      site_id:
        required: true
        type: integer
        nullable: false
      location_id:
        required: true
        type: integer
        nullable: false
    foreign_keys:
      - entity: site
        required: true
      - entity: location
        required: true

  site_type_group:
    role: classifier
    required: false
    description: Controlled grouping for site-type vocabularies used by archaeological site classifiers.
    domains: [core, spatial]
    target_table: tbl_site_type_groups
    public_id: site_type_group_id
    columns:
      site_type_group:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: false
      site_type_group_abbrev:
        type: string
        nullable: false
      origin_code:
        type: string
        nullable: true
      origin_description:
        type: string
        nullable: false
    unique_sets:
      - [site_type_group]

  site_type:
    role: classifier
    required: false
    description: Controlled vocabulary for site classification in SEAD.
    domains: [core, spatial]
    target_table: tbl_site_types
    public_id: site_type_id
    unique_sets:
      - [site_type]
    columns:
      site_type_group_id:
        required: true
        type: integer
        nullable: false
      site_type:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: false
      site_type_abbrev:
        type: string
        nullable: false
    foreign_keys:
      - entity: site_type_group
        required: false

  site_site_type:
    role: bridge
    required: false
    description: Relationship between a site and a site type, with primary-type and confidence metadata.
    domains: [core, spatial]
    target_table: tbl_site_site_types
    public_id: site_site_type_id
    unique_sets:
      - [site_id, site_type_id]
    columns:
      site_id:
        required: true
        type: integer
        nullable: false
      site_type_id:
        required: true
        type: integer
        nullable: false
      is_primary_type:
        required: true
        type: boolean
        nullable: false
      confidence_code:
        type: integer
        nullable: true
      notes:
        type: string
        nullable: true
    foreign_keys:
      - entity: site
        required_when:
          has_new_rows: site_site_type
      - entity: site_type
        required_when:
          has_new_rows: site_site_type

  sample_group:
    role: fact
    required: true
    description: Collection or contextual grouping that sits between site and physical samples.
    domains: [core]
    target_table: tbl_sample_groups
    public_id: sample_group_id
    columns:
      site_id:
        required: true
        type: integer
        nullable: false
      method_id:
        required: true
        type: integer
        nullable: false
      sample_group_name:
        required: true
        type: string
        nullable: true
      sample_group_description:
        type: string
        nullable: true
      sampling_context_id:
        type: integer
        nullable: true
    unique_sets:
      - [site_id, sample_group_name]
    foreign_keys:
      - entity: site
        required: true
      - entity: method
        required: true
      - entity: sample_group_sampling_context
        required: false

  sample_group_description_type:
    role: classifier
    required: false
    description: Controlled vocabulary for sample-group descriptions.
    domains: [core, sample-metadata]
    target_table: tbl_sample_group_description_types
    public_id: sample_group_description_type_id
    unique_sets:
      - [type_name]
    columns:
      type_name:
        type: string
        nullable: true
      type_description:
        type: string
        nullable: true

  sample_group_description:
    role: fact
    required: false
    description: Description attached to a sample group and description type.
    domains: [core, sample-metadata]
    target_table: tbl_sample_group_descriptions
    public_id: sample_group_description_id
    unique_sets:
      - [sample_group_id, sample_group_description_type_id]
    columns:
      group_description:
        type: string
        nullable: true
      sample_group_description_type_id:
        required: true
        type: integer
        nullable: false
      sample_group_id:
        type: integer
        nullable: true
    foreign_keys:
      - entity: sample_group_description_type
        required_when:
          has_new_rows: sample_group_description
      - entity: sample_group
        required: false

  lithology:
    role: fact
    required: false
    description: Stratigraphic description attached to a sample group.
    aggregate_parent: sample_group
    domains: [core, sample-metadata]
    target_table: tbl_lithology
    public_id: lithology_id
    unique_sets:
      - [sample_group_id, depth_top, depth_bottom]
    columns:
      depth_bottom:
        type: decimal
        nullable: true
      depth_top:
        required: true
        type: decimal
        nullable: false
      description:
        required: true
        type: string
        nullable: false
      lower_boundary:
        type: string
        nullable: true
      sample_group_id:
        required: true
        type: integer
        nullable: false
    foreign_keys:
      - entity: sample_group
        required_when:
          has_new_rows: lithology

  sample_group_sampling_context:
    role: classifier
    required: false
    description: Controlled vocabulary for sampling contexts attached to sample groups and related sample metadata 
      tables.
    domains: [core, sample-metadata]
    target_table: tbl_sample_group_sampling_contexts
    public_id: sampling_context_id
    columns:
      sampling_context:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
      sort_order:
        type: integer
        nullable: true
    unique_sets:
      - [sampling_context]

  sample_group_coordinate:
    role: fact
    required: false
    description: Coordinate or position measurement attached to a sample group.
    aggregate_parent: sample_group
    domains: [spatial, sample-metadata]
    target_table: tbl_sample_group_coordinates
    public_id: sample_group_position_id
    unique_sets:
      - [sample_group_id, coordinate_method_dimension_id]
    columns:
      sample_group_id:
        required: true
        type: integer
        nullable: false
      coordinate_method_dimension_id:
        required: true
        type: integer
        nullable: false
      sample_group_position:
        required: true
        type: decimal
        nullable: false
      position_accuracy:
        type: string
        nullable: true
    foreign_keys:
      - entity: sample_group
        required: true
      - entity: coordinate_method_dimension
        required: true

  sample_group_dimension:
    role: fact
    required: false
    description: Physical dimension measurement attached to a sample group.
    aggregate_parent: sample_group
    domains: [sample-metadata, physical-properties]
    target_table: tbl_sample_group_dimensions
    public_id: sample_group_dimension_id
    unique_sets:
      - [sample_group_id, dimension_id]
    columns:
      sample_group_id:
        required: true
        type: integer
        nullable: false
      dimension_id:
        required: true
        type: integer
        nullable: false
      dimension_value:
        required: true
        type: decimal
        nullable: false
      qualifier_id:
        type: integer
        nullable: true
    foreign_keys:
      - entity: sample_group
        required: true
      - entity: dimension
        required: true
      - entity: value_qualifier
        required: false

  sample_group_note:
    role: fact
    required: false
    description: Free-text note attached to a sample group.
    aggregate_parent: sample_group
    domains: [sample-metadata]
    target_table: tbl_sample_group_notes
    public_id: sample_group_note_id
    columns:
      sample_group_id:
        required: true
        type: integer
        nullable: false
      note:
        required: true
        type: string
        nullable: false
    unique_sets:
      - [sample_group_id, note]
    foreign_keys:
      - entity: sample_group
        required: true

  sample_group_reference:
    role: bridge
    required: false
    description: Bibliographic reference attached to a sample group.
    aggregate_parent: sample_group
    domains: [sample-metadata, provenance, bibliography]
    target_table: tbl_sample_group_references
    public_id: sample_group_reference_id
    columns:
      sample_group_id:
        required: true
        type: integer
        nullable: false
      biblio_id:
        required: true
        type: integer
        nullable: false
    unique_sets:
      - [sample_group_id, biblio_id]
    foreign_keys:
      - entity: sample_group
        required: true
      - entity: citation
        required: true

  sample:
    role: fact
    required: true
    description: Core analytical specimen represented in SEAD as a physical sample.
    domains: [core]
    target_table: tbl_physical_samples
    public_id: physical_sample_id
    columns:
      sample_group_id:
        required: true
        type: integer
        nullable: false
      sample_type_id:
        required: true
        type: integer
        nullable: false
      sample_name:
        required: true
        type: string
        nullable: false
      alt_ref_type_id:
        type: integer
        nullable: true
      date_sampled:
        type: string
        nullable: true
    unique_sets:
      - [sample_group_id, sample_name]
    foreign_keys:
      - entity: sample_group
        required: true
      - entity: sample_type
        required: true
      - entity: alt_ref_type
        required: false

  sample_description_type:
    role: classifier
    required: false
    description: Controlled vocabulary for typed sample descriptions.
    domains: [core, sample-metadata]
    target_table: tbl_sample_description_types
    public_id: sample_description_type_id
    columns:
      type_name:
        required: true
        type: string
        nullable: true
      type_description:
        type: string
        nullable: true
    unique_sets:
      - [type_name]

  sample_description:
    role: fact
    required: false
    description: Typed free-text or coded description attached to a physical sample.
    aggregate_parent: sample
    domains: [core, sample-metadata]
    target_table: tbl_sample_descriptions
    public_id: sample_description_id
    unique_sets:
      - [physical_sample_id, sample_description_type_id]
    columns:
      physical_sample_id:
        required: true
        type: integer
        nullable: false
      sample_description_type_id:
        required: true
        type: integer
        nullable: false
      description:
        type: string
        nullable: true
    foreign_keys:
      - entity: sample
        required: true
      - entity: sample_description_type
        required: true

  sample_colour:
    role: fact
    required: false
    description: Colour observation attached to a physical sample.
    aggregate_parent: sample
    domains: [sample-metadata]
    target_table: tbl_sample_colours
    public_id: sample_colour_id
    columns:
      physical_sample_id:
        required: true
        type: integer
        nullable: false
      colour_id:
        required: true
        type: integer
        nullable: false
    unique_sets:
      - [physical_sample_id, colour_id]
    foreign_keys:
      - entity: sample
        required: true
      - entity: colour
        required: true

  sample_type:
    role: classifier
    required: true
    description: Controlled vocabulary for sample classification.
    domains: [core]
    target_table: tbl_sample_types
    public_id: sample_type_id
    columns:
      type_name:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
    unique_sets:
      - [type_name]

  # PHASE 1 ADDITIONS - Spatial/Coordinate Domain

  dimension:
    role: classifier
    required: false
    description: Measurement dimension type (X, Y, Z, depth, altitude, thickness, etc.)
    domains: [spatial, physical-properties]
    target_table: tbl_dimensions
    public_id: dimension_id
    columns:
      dimension_abbrev:
        required: true
        type: string
        nullable: false
      dimension_name:
        required: true
        type: string
        nullable: false
      method_group_id:
        type: integer
        nullable: true
      unit_id:
        type: integer
        nullable: true
    unique_sets:
      - [dimension_abbrev]
    foreign_keys:
      - entity: method_group
        required: false
      - entity: unit
        required: false

  coordinate_method_dimension:
    role: classifier
    required: false
    description: Coordinate measurement method with dimensional constraints
    domains: [spatial]
    target_table: tbl_coordinate_method_dimensions
    public_id: coordinate_method_dimension_id
    columns:
      method_id:
        required: true
        type: integer
        nullable: false
      dimension_id:
        required: true
        type: integer
        nullable: false
      limit_upper:
        type: decimal
        nullable: true
      limit_lower:
        type: decimal
        nullable: true
    unique_sets:
      - [method_id, dimension_id]
    foreign_keys:
      - entity: method
        required: true
      - entity: dimension
        required: true

  sample_coordinate:
    role: fact
    required: false
    description: Spatial coordinate measurement for a physical sample
    aggregate_parent: sample
    domains: [spatial, sample-metadata]
    target_table: tbl_sample_coordinates
    public_id: sample_coordinate_id
    unique_sets:
      - [physical_sample_id, coordinate_method_dimension_id]
    columns:
      physical_sample_id:
        required: true
        type: integer
        nullable: false
      coordinate_method_dimension_id:
        required: true
        type: integer
        nullable: false
      measurement:
        required: true
        type: decimal
        nullable: false
      accuracy:
        type: decimal
        nullable: true
    foreign_keys:
      - entity: sample
        required: true
      - entity: coordinate_method_dimension
        required: true

  # PHASE 1 ADDITIONS - Sample Metadata Domain

  alt_ref_type:
    role: classifier
    required: false
    description: Type of alternative reference (lab number, field ID, museum number)
    domains: [sample-metadata]
    target_table: tbl_alt_ref_types
    public_id: alt_ref_type_id
    columns:
      alt_ref_type:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
    unique_sets:
      - [alt_ref_type]

  colour:
    role: classifier
    required: false
    description: Controlled colour vocabulary used by sample-colour observations.
    domains: [sample-metadata]
    target_table: tbl_colours
    public_id: colour_id
    columns:
      method_id:
        required: true
        type: integer
        nullable: false
      colour_name:
        required: true
        type: string
        nullable: false
      rgb:
        type: integer
        nullable: true
    unique_sets:
      - [method_id, colour_name]
    foreign_keys:
      - entity: method
        required: true

  value_qualifier:
    role: classifier
    required: false
    description: Base qualifier vocabulary for qualified values such as greater-than or less-than.
    domains: [sample-metadata, analysis]
    target_table: tbl_value_qualifiers
    public_id: qualifier_id
    columns:
      symbol:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
    unique_sets:
      - [symbol]

  value_qualifier_symbol:
    role: classifier
    required: false
    description: Alternate symbol mapped to a base value qualifier.
    domains: [sample-metadata, analysis]
    target_table: tbl_value_qualifier_symbols
    public_id: qualifier_symbol_id
    columns:
      symbol:
        required: true
        type: string
        nullable: false
      cardinal_qualifier_id:
        required: true
        type: integer
        nullable: false
    unique_sets:
      - [symbol]
    foreign_keys:
      - entity: value_qualifier
        required: true

  value_type:
    role: classifier
    required: false
    description: Value-type definition describing the base storage shape and optional unit for analytical values.
    domains: [analysis]
    target_table: tbl_value_types
    public_id: value_type_id
    columns:
      unit_id:
        type: integer
        nullable: true
      data_type_id:
        type: integer
        nullable: true
      name:
        required: true
        type: string
        nullable: false
      base_type:
        required: true
        type: string
        nullable: false
      precision:
        type: integer
        nullable: true
      description:
        required: true
        type: string
        nullable: false
    unique_sets:
      - [name]
    foreign_keys:
      - entity: unit
        required: false
      - entity: data_type
        required: false

  value_type_item:
    role: classifier
    required: false
    description: Category value attached to a categorical value type.
    domains: [analysis]
    target_table: tbl_value_type_items
    public_id: value_type_item_id
    aggregate_parent: value_type
    columns:
      value_type_id:
        required: true
        type: integer
        nullable: false
      name:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
    unique_sets:
      - [value_type_id, name]
    foreign_keys:
      - entity: value_type
        required: true

  value_class:
    role: classifier
    required: false
    description: Analytical value class describing a data column or measurement family.
    domains: [analysis]
    target_table: tbl_value_classes
    public_id: value_class_id
    columns:
      value_type_id:
        required: true
        type: integer
        nullable: false
      method_id:
        required: true
        type: integer
        nullable: false
      parent_id:
        type: integer
        nullable: true
      name:
        required: true
        type: string
        nullable: false
      description:
        required: true
        type: string
        nullable: false
    unique_sets:
      - [value_type_id, method_id, name]
    foreign_keys:
      - entity: value_type
        required: true
      - entity: method
        required: true
      - entity: value_class
        required: false

  sample_alt_ref:
    role: fact
    required: false
    description: Alternative reference identifier for a sample
    aggregate_parent: sample
    domains: [sample-metadata]
    target_table: tbl_sample_alt_refs
    public_id: sample_alt_ref_id
    columns:
      physical_sample_id:
        required: true
        type: integer
        nullable: false
      alt_ref_type_id:
        required: true
        type: integer
        nullable: false
      alt_ref:
        required: true
        type: string
        nullable: false
    unique_sets:
      - [physical_sample_id, alt_ref_type_id, alt_ref]
    foreign_keys:
      - entity: sample
        required: true
      - entity: alt_ref_type
        required: true

  sample_dimension:
    role: fact
    required: false
    description: Physical dimension measurement of a sample
    aggregate_parent: sample
    domains: [sample-metadata, physical-properties]
    target_table: tbl_sample_dimensions
    public_id: sample_dimension_id
    unique_sets:
      - [physical_sample_id, dimension_id, method_id]
    columns:
      physical_sample_id:
        required: true
        type: integer
        nullable: false
      dimension_id:
        required: true
        type: integer
        nullable: false
      method_id:
        required: true
        type: integer
        nullable: false
      dimension_value:
        required: true
        type: decimal
        nullable: false
      qualifier_id:
        type: integer
        nullable: true
    foreign_keys:
      - entity: sample
        required: true
      - entity: dimension
        required: true
      - entity: method
        required: true
      - entity: value_qualifier
        required: false

  sample_location_type:
    role: classifier
    required: false
    description: Controlled vocabulary for within-sample location descriptions.
    domains: [sample-metadata, spatial]
    target_table: tbl_sample_location_types
    public_id: sample_location_type_id
    columns:
      location_type:
        required: true
        type: string
        nullable: false
      location_type_description:
        type: string
        nullable: true
    unique_sets:
      - [location_type]

  sample_location:
    role: fact
    required: false
    description: Typed within-sample location note attached to a physical sample.
    aggregate_parent: sample
    domains: [sample-metadata, spatial]
    target_table: tbl_sample_locations
    public_id: sample_location_id
    columns:
      physical_sample_id:
        required: true
        type: integer
        nullable: false
      sample_location_type_id:
        required: true
        type: integer
        nullable: false
      location:
        required: true
        type: string
        nullable: false
    unique_sets:
      - [physical_sample_id, sample_location_type_id, location]
    foreign_keys:
      - entity: sample
        required: true
      - entity: sample_location_type
        required: true

  sample_note:
    role: fact
    required: false
    description: Free-text note attached to a physical sample.
    aggregate_parent: sample
    domains: [sample-metadata]
    target_table: tbl_sample_notes
    public_id: sample_note_id
    columns:
      physical_sample_id:
        required: true
        type: integer
