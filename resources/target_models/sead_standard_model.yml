        type: integer
        nullable: false
      property_type_id:
        required: true
        type: integer
        nullable: false
      property_value:
        required: true
        type: string
        nullable: false
    foreign_keys:
      - entity: site
        required: true
      - entity: property_type
        required: true

  feature_property:
    role: fact
    required: false
