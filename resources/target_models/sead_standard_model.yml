    target_table: tbl_contact_types
    public_id: contact_type_id
    columns:
      contact_type_name:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
    unique_sets:
      - [contact_type_name]

  dataset_contact:
    role: bridge
    required: false
