    target_table: tbl_feature_properties
    public_id: feature_property_id
    unique_sets:
      - [feature_id, property_type_id, property_value]
    columns:
      feature_id:
        required: true
        type: integer
        nullable: false
      property_type_id:
        required: true
        type: integer
        nullable: false
      property_value:
        required: true
        type: string
        nullable: false
    foreign_keys:
      - entity: feature
        required: true
      - entity: property_type
        required: true

  site_natgridref:
    role: fact
    required: false
    description: National-grid reference attached to a site using a specific method or coordinate system.
