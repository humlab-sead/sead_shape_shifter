    unique_sets:
      - [physical_sample_id, feature_id]
    columns:
      physical_sample_id:
        required: true
        type: integer
        nullable: false
      feature_id:
        required: true
        type: integer
        nullable: false
    foreign_keys:
      - entity: sample
        required: true
      - entity: feature
        required: true

  language:
    role: classifier
    required: false
    description: Language of a recorded taxon common name.
