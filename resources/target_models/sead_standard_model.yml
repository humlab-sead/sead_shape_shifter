      language_name_english:
        type: string
        nullable: true
      language_name_native:
        type: string
        nullable: true
    unique_sets:
      - [language_name_english]

  data_type_group:
    role: classifier
    required: false
    description: Grouping of related data types used to organise analytical output.
    domains: [core]
    target_table: tbl_data_type_groups
    public_id: data_type_group_id
    columns:
      data_type_group_name:
        required: true
        type: string
        nullable: false
      description:
        type: string
        nullable: true
    unique_sets:
      - [data_type_group_name]

  data_type:
    role: classifier
    required: false
    description: Controlled vocabulary for the type of data produced by an analytical method.
    domains: [core]
    target_table: tbl_data_types
    public_id: data_type_id
    columns:
      data_type_name:
        required: true
        type: string
        nullable: false
      data_type_group_id:
        type: integer
        nullable: true
