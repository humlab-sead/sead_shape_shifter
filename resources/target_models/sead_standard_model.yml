    target_table: tbl_site_natgridrefs
    public_id: site_natgridref_id
    unique_sets:
      - [site_id, method_id, natgridref]
    columns:
      site_id:
        required: true
        type: integer
        nullable: false
      method_id:
        required: true
        type: integer
        nullable: false
      natgridref:
        required: true
        type: string
        nullable: false
