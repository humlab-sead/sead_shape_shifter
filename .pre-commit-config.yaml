# Pre-commit configuration to prevent import issues
repos:
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.13.2
  #   hooks:
  #     - id: ruff
  #       args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3.13
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "142"]
        language_version: python3.13
  - repo: local
    hooks:
      - id: protected-branch-commit
        name: Block protected-path commits on protected branches
        entry: bash scripts/verify_promotion_provenance.sh --check-local-commit
        language: system
        pass_filenames: false
        always_run: true
