# Pre-commit configuration to prevent import issues
repos:
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.13.2
  #   hooks:
  #     - id: ruff
  #       args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3.13
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "142"]
        language_version: python3.13
  - repo: local
    hooks:
      - id: protected-branch-commit
        name: Block protected-path commits on protected branches
        entry: bash scripts/ci/verify_promotion_provenance.sh --check-local-commit
        language: system
        pass_filenames: false
        always_run: true
      - id: claude-rules-up-to-date
        name: Check .claude/rules matches .github/instructions
        entry: python3 scripts/dev/sync_claude_rules.py --check
        language: system
        pass_filenames: false
        files: ^(\.github/instructions/|\.claude/rules/|scripts/dev/sync_claude_rules\.py$)
      - id: instruction-references
        name: Check links and paths in AI instruction files
        entry: python3 scripts/ci/check_instruction_references.py
        language: system
        pass_filenames: false
        # Renaming or deleting any file can break a reference, so run on every commit.
        always_run: true
