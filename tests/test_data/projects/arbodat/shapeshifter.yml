metadata:
  name: rebecka-arbodat-2
  type: shapeshifter-project
  description: Configuration for importing data from ArboDat database into SEAD.
  version: 1.0.0
  data_provider_code: arbodat-pilot
  provider_schema: archeobotany/arbodat-pilot
  default_entity: survey
  target_model: '@load: ${GLOBAL_TARGET_MODEL_DIR}/sead_standard_model.yml'
entities:
  abundance:
    type: sql
    data_source: arbodat_data
    public_id: abundance_id
    keys: '@value: entities.analysis_entity.keys'
    columns:
    - Projekt
    - Befu
    - ProbNr
    - PCODE
    - Fraktion
    - cf
    - RTyp
    - Zust
    - rAnzahl
    - rGewicht
    - geschätzt
    - rFrag
    - Multiplikator
    - FAnzahl
    - FFragmente
    - FGewicht
    - EDatProb
    - AnmFrakt
    query: select [Projekt], [Befu], [ProbNr], [PCODE], [Fraktion], [cf], [RTyp], [Zust], [rAnzahl], [rGewicht], [geschätzt], [rFrag], [Multiplikator], [FAnzahl], [FFragmente], [FGewicht], [EDatProb], [AnmFrakt] from [Details];
    foreign_keys:
    - entity: analysis_entity
      local_keys: '@value: entities.analysis_entity.keys'
      remote_keys: '@value: entities.analysis_entity.keys'
      constraints:
        allow_unmatched_left: false
        allow_null_keys: false
        cardinality: many_to_one
    - entity: taxa
      local_keys: [PCODE]
      remote_keys: [PCODE]
      constraints:
        allow_unmatched_left: false
        allow_null_keys: false
        cardinality: many_to_one
    - entity: abundance_element
      local_keys: [RTyp]
      remote_keys: [RTyp]
      constraints:
        allow_unmatched_left: false
        allow_null_keys: false
        cardinality: many_to_one
    depends_on: [analysis_entity]
    extra_columns:
      abundance: FAnzahl
  abundance_element:
    type: fixed
    public_id: abundance_element_id
    keys: [RTyp]
    columns:
    - system_id
    - abundance_element_id
    - RTyp
    - abundance_element_group_id
    - element_description
    - element_name
    - record_type_id
    - RTypGrup
    - RTypNr
    - Resttyp
    column_types:
      RTypNr: int
      abundance_element_id: string
      RTyp: string
      abundance_element_group_id: int
    values: '@load:materialized/abundance_element.parquet'
    materialized:
      enabled: true
      source_state:
        type: sql
        keys: [RTyp]
        columns: [RTyp, Resttyp, RTypGrup, RTypNr]
        public_id: abundance_element_id
        data_source: arbodat_lookup
        query: select [RTyp], [Resttyp], [RTypGrup], [RTypNr] from [RTyp];
        foreign_keys:
        - entity: abundance_element_group
          local_keys: [RTypGrup]
          remote_keys: [RTypGrup]
        depends_on: [abundance_element_group]
        extra_columns:
          element_name: Resttyp
          element_description:
          record_type_id: '2'
      materialized_at: '2026-10-08T11:34:52.501403'
    foreign_keys:
    - entity: abundance_element_group
      local_keys: [RTypGrup]
      remote_keys: [RTypGrup]
      how: inner
      constraints:
        cardinality: many_to_one
        allow_unmatched_right: true
        require_unique_left: false
        require_unique_right: false
        allow_row_decrease: true
  abundance_element_group:
    type: fixed
    public_id: abundance_element_group_id
    keys: [RTypGrup]
    columns:
    - system_id
    - abundance_element_group_id
    - abundance_element_group_name
    - Nummer
    - RTypGrup
    - RTypGrup_EN
    values:
    - [1, null, '-99', 9999, '-99', '-99']
    - [2, null, Wood, 20, Holz, Wood]
    - [3, null, Seeds/Fruits etc., 30, Samen/Früchte usw., Seeds/Fruits etc.]
    - [4, null, Others, 50, sonstiges, Others]
    - [5, null, Unknown, 999, unbekannt, Unknown]
    - [6, null, Veg. Remains, 40, veget. Pflanzenteile, Veg. Remains]
    materialized:
      enabled: true
      source_state:
        type: sql
        keys: [RTypGrup]
        columns: [RTypGrup, RTypGrup_EN, Nummer]
        public_id: abundance_element_group_id
        data_source: arbodat_lookup
        query: |-
          select [RTypGrup], [RTypGrup_EN], [Nummer]
          from [RtypGruppen];
        extra_columns:
          abundance_element_group_name: RTypGrup_EN
      materialized_at: '2026-03-13T14:41:04.914235'
  abundance_modification:
    type: entity
    source: abundance
    public_id: abundance_modification_id
    keys: [abundance_id]
    columns: [abundance_id, Zust]
    foreign_keys:
    - entity: modification_type
      local_keys: [Zust]
      remote_keys: [Zust]
    depends_on: [abundance]
  abundance_property:
    type: entity
    source: abundance
    public_id: abundance_property_id
    keys: []
    columns:
    - abundance_id
    - property_type
    - rAnzahl
    - rGewicht
    - geschätzt
    - rFrag
    - Multiplikator
    - FAnzahl
    - FFragmente
    - FGewicht
    - EDatProb
    - AnmFrakt
    foreign_keys:
    - entity: property_type
      local_keys: [property_group, property_type]
      remote_keys: [property_group, arbodat_code]
    depends_on: [abundance, property_type]
    drop_duplicates: true
    drop_empty_rows: [property_value]
    check_functional_dependency: true
    unnest:
      id_vars: [abundance_id, property_group]
      value_vars:
      - rAnzahl
      - rGewicht
      - geschätzt
      - rFrag
      - Multiplikator
      - FAnzahl
      - FFragmente
      - FGewicht
      - EDatProb
      - AnmFrakt
      var_name: property_type
      value_name: property_value
    extra_columns:
      property_group: abundance_property_scope
  property_type:
    type: fixed
    public_id: property_type_id
    keys: [property_group, arbodat_code]
    columns:
    - system_id
    - property_type_id
    - property_group
    - arbodat_code
    - property_type_name
    - description
    values:
    - [1, null, abundance_property_scope, rAnzahl, raw_count, Counted number of finds of one type of plant remains from a sieving fraction or parts of a sieving fraction]
    - [2, null, abundance_property_scope, rGewicht, raw_weight, Weight  of one type of plant remains from a sieving fraction or parts of a sieving fraction]
    - [3, null, abundance_property_scope, geschätzt, estimated_amount, Checked (1) if the counts are estimated]
    - [4, null, abundance_property_scope, rFrag, raw_fragments, Counted number of fragments of one type of plant remains from a sieving fraction or parts of a sieving fraction]
    - [5, null, abundance_property_scope, Multiplikator, multiplier, Used if only part of a fraction is analysed. E.g. if 1/4 is sorted the multiplier is 4. The multiplier is used to calculate extrapolated count/fragments/weight]
    - [6, null, abundance_property_scope, FAnzahl, extrapolated_count, Extrapolated count = raw_count * multiplier]
    - [7, null, abundance_property_scope, FFragmente, extrapolated_fragments, Extrapolated fragments = raw_fragments * multiplier]
    - [8, null, abundance_property_scope, FGewicht, extrapolated_weight, 'Extrapolated weight = raw_weight * multiplier ']
    - [9, null, abundance_property_scope, EDatProb, entry_date, Entry date in ArboDat]
    - [10, null, abundance_property_scope, AnmFrakt, note, 'Remarks on the botanical determination. ']
    - [11, null, site_property_scope, Limes, Limes, Within Limes. Checked in case of Roman sites]
    - [12, null, site_property_scope, okFustel, okFustel, 'Methodological assessment of the site: adequate or deficient']
    - [13, null, site_property_scope, TK, Map sheet, 'TK 25 (Topographic Map 1:25,000)']
    - [14, null, site_property_scope, EVNr, EVNr, Site identifier]
    - [15, null, site_property_scope, AnmFustel, AnmFustel, Free text entry for all kind of informations related to the site]
    - [16, null, feature_property_scope, gebäud, Building context, 'Denotes if a feature is part of a building. Possible values: ja/nein/? ']
    - [17, null, feature_property_scope, okBefu, Feature ok, Methodological classification of the feature is ok or not.]
    - [18, null, feature_property_scope, okErh, Preservation, 'Preservation of the plant remains: good/medium/bad  (/mittel/schlecht)']
    - [19, null, feature_property_scope, BestJa, Determination year, Year of botanical determination]
    - [20, null, feature_property_scope, FlSchn, Excavation area, Used to distinguish between identical feature numbers in same excavation.]
    - [21, null, feature_property_scope, Anmerkung, Notes, Notes on the feature]
  analysis_entity:
    type: sql
    data_source: arbodat_data
    public_id: analysis_entity_id
    keys:
    - Projekt
    - Befu
    - ProbNr
    - PCODE
    - Fraktion
    - cf
    - RTyp
    - Zust
    columns:
    - Projekt
    - Befu
    - ProbNr
    - PCODE
    - Fraktion
    - cf
    - RTyp
    - Zust
    query: select [Projekt], [Befu], [ProbNr], [PCODE], [Fraktion], [cf], [RTyp], [Zust] from [Details];
    foreign_keys:
    - entity: sample
      local_keys: [Projekt, Befu, ProbNr]
      remote_keys: [Projekt, Befu, ProbNr]
      constraints:
        allow_unmatched_left: false
        allow_null_keys: false
        cardinality: many_to_one
    - entity: taxa
      local_keys: [PCODE]
      remote_keys: [PCODE]
      how: left
      constraints:
        allow_unmatched_left: false
        allow_null_keys: false
    - entity: method
      local_keys: [Fraktion]
      remote_keys: [arbodat_code]
      how: left
      constraints:
        allow_unmatched_left: false
        cardinality: many_to_one
    depends_on: [method, taxa, sample]
  archaeological_period:
    type: sql
    data_source: arbodat_lookup
    public_id: archaeological_period_id
    keys: [ArchDat]
    columns: [ArchDat, Beschreibung, Epoche, Nummer]
    query: select distinct [ArchDat], [Beschreibung], [Epoche], [Nummer] from [ArchDat] ;
  chronological_period:
    type: sql
    source:
    data_source: arbodat_lookup
    public_id: chronological_period_id
    keys: [ChronoDat]
    columns: [ChronoDat, Beschreibung, Nummer, von, bis]
    query: select distinct [ChronoDat], [Beschreibung], [Nummer], [von], [bis] from [ChronoDat] ;
    depends_on: []
  contact:
    type: entity
    source: project_contact_helper
    public_id: contact_id
    keys: []
    columns: [contact_name, contact_type]
    foreign_keys:
    - entity: contact_type
      local_keys: [contact_type]
      remote_keys: [arbodat_code]
    depends_on: [contact_type, project_contact_helper]
    drop_duplicates: true
    append:
      source:
      data_source: arbodat_data
      check_column_names: false
      type: sql
      query: select distinct [BotBest], "BotBest" from [Befunde] where [BotBest] is not null ;
  contact_type:
    type: fixed
    source:
    public_id: contact_type_id
    keys: [arbodat_code]
    columns: [system_id, contact_type_id, contact_type_name, description, arbodat_code]
    values:
    - [1, null, Archaeologist, Name of scientist responsible for processing the archaeological material, ArchBear]
    - [2, null, Botanist, Name of scientist responsible for the botanical determination (possibly several persons), BotBear]
    - [3, null, 'Author(s) ', Publication/manuscript/short report, Aut]
    - [4, null, Bot. Determination, 'Name(s) of person(s) responsible for charcoal or seed/fruit determination, etc', BotBest]
    - [5, null, Site Director/Institution, Name of site director and/or institution, ArchAusg]
    contact_types: [ArchAusg, ArchBear, BotBear, Aut, BotBest]
  citation:
    type: fixed
    public_id: biblio_id
    keys: [title, year, authors]
    columns:
    - bugs_reference
    - doi
    - isbn
    - notes
    - title
    - year
    - authors
    - full_reference
    - url
    values: []
  coordinate_method_dimension:
    type: fixed
    source:
    public_id: coordinate_method_dimension_id
    keys: []
    columns:
    - system_id
    - coordinate_method_dimension_id
    - method_name
    - limit_upper
    - limit_lower
    - arbodat_dimension_code
    values:
    - [1, null, Local or unknown grid, null, null, KoordX]
    - [2, null, Local or unknown grid, null, null, KoordY]
    - [3, null, Local or unknown grid, null, null, KoordZ]
    - [4, null, Altitude above sea level, null, null, Prob_üNN]
    foreign_keys:
    - entity: dimension
      local_keys: [arbodat_dimension_code]
      remote_keys: [arbodat_code]
      how: left
    - entity: method
      local_keys: [method_name]
      remote_keys: [method_name]
      constraints:
        allow_unmatched_left: false
        allow_null_keys: false
      how: left
    depends_on: [dimension, method]
  coordinate_system:
    type: sql
    source:
    data_source: arbodat_lookup
    public_id: coordinate_system_id
    keys: [Koordsys]
    columns: [Index, Koordsys, Bemerkung]
    query: select distinct [Index], [Koordsys], [Bemerkung] from [KoordSys] ;
    depends_on: []
    drop_duplicates: true
  cultural_group:
    type: sql
    source:
    data_source: arbodat_lookup
    public_id: cultural_group_id
    keys: [KultGr]
    columns: [KultGr, Cult_EN]
    query: select distinct KultGr, Cult_EN from Kulturgruppen;
    depends_on: []
    drop_duplicates: true
  dataset:
    type: entity
    source: analysis_entity
    public_id: dataset_id
    keys: [Projekt, Fraktion]
    columns: [Projekt, Fraktion]
    foreign_keys:
    - entity: project
      local_keys: [Projekt]
      remote_keys: [Projekt]
      how: left
      constraints:
        cardinality: many_to_one
        allow_unmatched_right: true
        require_unique_left: false
        require_unique_right: false
        allow_row_decrease: true
        allow_null_keys: false
    - entity: method
      local_keys: [Fraktion]
      remote_keys: [arbodat_code]
      how: left
      constraints:
        allow_unmatched_left: false
        require_unique_left: false
        cardinality: many_to_one
        allow_unmatched_right: true
        require_unique_right: false
        allow_row_decrease: true
    - entity: master_dataset
      local_keys: [master_set_name]
      remote_keys: [master_name]
      constraints:
        cardinality: many_to_one
        allow_unmatched_right: true
        require_unique_left: false
        require_unique_right: false
        allow_row_decrease: true
    depends_on: [method, project]
    drop_duplicates: true
    check_functional_dependency: true
    extra_columns:
      dataset_name: '"Arbodat Pilot {Fraktion}"'
      master_set_id:
      data_type_id: 5
      biblio_id:
      project_id:
      updated_dataset_id:
      master_set_name: ArboDat Pilot
      submission_id: 1
  dataset_contacts:
    type: entity
    source: dataset
    public_id: dataset_contact_id
    keys: [Projekt, Fraktion, contact_id]
    columns: [Projekt, Fraktion]
    foreign_keys:
    - entity: project_contact_helper
      local_keys: [Projekt]
      remote_keys: [Projekt]
      extra_columns:
        contact_name: contact_name
    - entity: contact
      local_keys: [contact_name]
      remote_keys: [contact_name]
    depends_on: [project_contact_helper, contact, dataset, project]
    drop_duplicates: [Projekt, Fraktion, contact_id]
  dataset_submission:
    type: entity
    source: dataset
    public_id: dataset_submission_id
    keys: []
    columns: [dataset_id]
    foreign_keys:
    - entity: dataset_submission_type
      local_keys: [submission_type_id]
      remote_keys: [dataset_submission_type_id]
    depends_on: [dataset]
    extra_columns:
      date_submitted:
      submission_type_id: 1
      notes:
  dataset_submission_type:
    type: fixed
    public_id: dataset_submission_type_id
    keys: []
    columns: [system_id, dataset_submission_type_id]
    column_types:
      dataset_submission_type_id: int
    values:
    - [1, 5]
  data_provider:
    type: fixed
    public_id: data_provider_id
    keys: [data_provider_code]
    columns: [data_provider_code, data_provider_name, contact_id]
    column_types:
      data_provider_code: string
      data_provider_name: string
      contact_id: int
    values:
    - [1, 1, arbodat-pilot, Arbodat Pilot, null]
  submission:
    type: fixed
    public_id: submission_id
    keys: [submission_identifier]
    columns:
    - system_id
    - submission_state
    - upload_date
    - submission_date
    - submission_identifier
    - issue_identifier
    - author
    - notes
    - data_provider_code
    - submission_name
    - source_name
    - data_types
    values:
    - [1, PENDING, '2024-06-06', '2024-06-06', ARBODAT_PILOT, issue, An author, Some notes, DP_CODE, Arbodat pilot, datafile.xlsx, archeaobotany]
    foreign_keys:
    - entity: data_provider
      local_keys: [data_provider_code]
      remote_keys: [data_provider_code]
      how: left
    - entity: submission_state
      local_keys: [submission_state]
      remote_keys: [submission_state]
      how: left
  submission_state:
    type: fixed
    public_id: submission_state_id
    keys: []
    columns: [system_id, submission_state]
    values:
    - [1, PENDING]
  dating:
    type: sql
    source:
    data_source: arbodat_data
    public_id: dating_id
    keys: [Projekt, Befu, ProbNr]
    columns:
    - Projekt
    - Befu
    - ProbNr
    - Unterprobe
    - Labornummer
    - Material
    - Methode
    - Waldkante
    - C14-Alter BP
    - Standardab C14
    - C14 cal
    - Dendroalter
    - Alter andere
    - 13C PDB-Wert
    - Standardab 13C PDB
    - pMC-Wert
    - Standardab PMC
    - Anmerkungen
    query: |-
      select distinct
        [Projekt],
        [Befu],
        [ProbNr],
        [Unterprobe],
        [Labornummer],
        [Material],
        [Methode],
        [Waldkante],
        [C14-Alter BP],
        [Standardab C14],
        [C14 cal],
        [Dendroalter],
        [Alter andere],
        [13C PDB-Wert],
        [Standardab 13C PDB],
        [pMC-Wert],
        [Standardab PMC],
        [Anmerkungen]
      from [Datierung] ;
    foreign_keys:
    - entity: sample
      local_keys: [Projekt, Befu, ProbNr]
      remote_keys: [Projekt, Befu, ProbNr]
    depends_on: [sample]
    drop_duplicates: true
  dating_period:
    type: sql
    source:
    data_source: arbodat_data
    public_id: dating_period_id
    keys: '@value: entities.sample.keys'
    columns: "@value: entities.sample.keys + ['ChronoDat', 'ArchDat']"
    query: |-
      select distinct [Projekt], [Befu], [ProbNr], [ChronoDat], [ArchDat]
      from [Proben] ;
    foreign_keys:
    - entity: sample
      local_keys: '@value: entities.sample.keys'
      remote_keys: '@value: entities.sample.keys'
    - entity: chronological_period
      local_keys: [ChronoDat]
      remote_keys: [ChronoDat]
      how: left
    - entity: archaeological_period
      local_keys: [ArchDat]
      remote_keys: [ArchDat]
      how: left
    depends_on: [sample]
    drop_empty_rows: [ChronoDat, ArchDat]
  dimension:
    type: fixed
    source:
    public_id: dimension_id
    keys: []
    columns:
    - system_id
    - dimension_id
    - dimension_name
    - dimension_abbrev
    - dimension_description
    - method_group_id
    - unit_id
    - arbodat_code
    values:
    - [1, null, X/North, X/N, X coordinate or Northing in intrinsic units., 17, 5, KoordX]
    - [2, null, X/East, X/E, X coordinate or Easting in intrinsic units., 17, 5, KoordY]
    - [3, null, Z/Altitude, Z/Alt, Z coordinate or Altitude in intrinsic units., 17, 5, KoordZ]
    - [4, null, Sampling height above sea level, Sampling ASL, Sampling height above sea level., 17, 1, Prob_üNN]
    depends_on: []
  epoch:
    type: sql
    data_source: arbodat_lookup
    public_id: epoch_id
    keys: [Epoche]
    columns: [Epoche, Beschreibung, Epoch_EN, Nummer]
    query: select distinct [Epoche], [Beschreibung], [Epoch_EN], [Nummer] from [Epochen] ;
    drop_duplicates: true
    check_functional_dependency: false
    extra_columns:
      epoch_name: Beschreibung
  feature:
    type: sql
    data_source: arbodat_data
    public_id: feature_id
    keys: [Projekt, Befu]
    columns:
    - Projekt
    - Befu
    - FlSchn
    - BefuTyp
    - FuTypVermut
    - gebäud
    - okBefu
    - okErh
    - BotBest
    - BestJa
    - Anmerkung
    query: select [Projekt], [Befu], [FlSchn], [BefuTyp], [FuTypVermut], [gebäud], [okBefu], [okErh], [BotBest], [BestJa], [Anmerkung] from [Befunde]
    foreign_keys:
    - entity: project
      local_keys: [Projekt]
      remote_keys: [Projekt]
      extra_columns:
        site_id: site_id
    - entity: feature_type
      local_keys: [BefuTyp]
      remote_keys: [Befundtyp]
      how: left
    depends_on: [project]
    drop_duplicates: [Projekt, Befu]
    check_functional_dependency: true
    extra_columns:
      feature_name: Befu
  feature_property:
    type: sql
    data_source: arbodat_data
    public_id: feature_property_id
    keys: [Projekt, Befu, property_type]
    columns:
    - Projekt
    - Befu
    - FlSchn
    - gebäud
    - okBefu
    - okErh
    - BestJa
    - Anmerkung
    query: "select [Projekt], [Befu], [FlSchn], [gebäud], [okBefu], [okErh], [BestJa], [Anmerkung] from [Befunde] where [Projekt] in ('19_0013', '19_0014', '22_0005', '18_0025', '22_0015'); "
    foreign_keys:
    - entity: feature
      local_keys: [Projekt, Befu]
      remote_keys: [Projekt, Befu]
      constraints:
        cardinality: one_to_many
        allow_unmatched_right: true
        require_unique_left: false
        require_unique_right: false
        allow_row_decrease: true
    - entity: property_type
      local_keys: [property_group, property_type]
      remote_keys: [property_group, arbodat_code]
      how: left
      constraints:
        cardinality: many_to_one
        allow_unmatched_right: true
        require_unique_left: false
        require_unique_right: false
        allow_row_decrease: true
    depends_on: [feature, property_type]
    drop_duplicates: [Projekt, Befu, property_type]
    drop_empty_rows: [property_value]
    check_functional_dependency: true
    unnest:
      id_vars: [Projekt, Befu, property_group]
      value_vars:
      - FlSchn
      - gebäud
      - okBefu
