notes:
  location: |-
    Foss Nordre was removed as a location from the imported locations due to being a site rather than a location. 
    There are several hits for Göteborg in SEAD, the most common id was selected (also for Tanum).  
    Deduplication does not work after the entity was materialized, therefore there are duplicates.
  feature_property_type: |-
    Possible values needs review
    In the pilot project, okBefu is 1 for all features, gebäud is empty/0/1, okErh is 1 or 2
  feature_property: |-
    If drop emtpy rows is set for the column feature_property_value, string values in the column are displayed as "Invalid number" in the preview.

    feature_property_value is the result of unnesting and has empty values for some feature properties.
    One type of feature property is Anmerkung (notes). The notes should be displayed as text.
