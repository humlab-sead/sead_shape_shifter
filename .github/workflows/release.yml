name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # Do not leave the workflow token in git config: the release commit must be
          # pushed as the release bot, which is the only actor allowed to bypass the
          # PR-only ruleset on main.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install semantic-release and plugins
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec
      - name: Mint release bot token
        id: release-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Authenticate git with the release bot
        env:
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          # semantic-release/git runs a plain `git push`, so it authenticates through
          # this header rather than GH_TOKEN. Without it the push runs as the
          # workflow token and the main-branch ruleset rejects it.
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)"

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: semantic-release

      - name: Upload user-facing release notes
        uses: actions/upload-artifact@v4
        with:
          name: user-facing-release-notes
          path: docs/whats-new/v*.md
          if-no-files-found: ignore
