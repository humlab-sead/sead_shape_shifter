# ==============================================================================
# Podman Compose configuration for Shape Shifter
#
# Works with podman-compose and with Podman's compose provider.
#
# Usage (prefer the Makefile, which sets CONTAINER_DATA_DIR for you):
#   export CONTAINER_DATA_DIR="$PWD/../container-data"
#   podman-compose -f podman-compose.yml up -d
#   podman-compose -f podman-compose.yml logs -f
#   podman-compose -f podman-compose.yml down
#
# Every path is driven by CONTAINER_DATA_DIR so the file works no matter which
# directory the compose command runs from.
# ==============================================================================

# podman-compose creates a pod for the project by default. Podman refuses to
# combine a pod with "userns_mode: keep-id", so run the service as a plain
# container that publishes its own port.
x-podman:
  in_pod: false

services:
  shape-shifter:
    # The build section supports local development only: with SOURCE=workdir the
    # context must be the repository root. On deployment hosts, build the image
    # with `make build` (scripts/build.sh), which uses this directory as context
    # and the GitHub source (SOURCE=github). `make up` reuses that image.
    build:
      context: ..
      dockerfile: container/Containerfile
      args:
        # Source selection. "github" clones the repository during the build;
        # "workdir" builds from the local repository checkout.
        - SOURCE=${SOURCE:-workdir}
        - GIT_REPO=${GIT_REPO:-https://github.com/humlab-sead/sead_shape_shifter.git}
        - GIT_REF=${GIT_REF:-main}
        - CACHE_BUST=${CACHE_BUST:-1}

        # User ID settings. Rootless Podman keeps the host user, so these must
        # match the deployment user (see scripts/build.sh, which passes id -u/-g).
        - USER_UID=${USER_UID:-1000}
        - USER_GID=${USER_GID:-1000}

        # Build-time arguments for the frontend (served by the backend, so the
        # API base URL stays empty for same-origin requests).
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-""}
        - VITE_ENV=${VITE_ENV:-production}
        - VITE_ENABLE_ANALYTICS=${VITE_ENABLE_ANALYTICS:-false}
        - VITE_ENABLE_DEBUG=${VITE_ENABLE_DEBUG:-false}

    image: ${IMAGE_NAME:-shape-shifter:latest}
    container_name: shape-shifter

    # Rootless Podman: map the host user to the same UID/GID inside the
    # container so the non-root container user can write bind-mounted data.
    userns_mode: "keep-id"

    ports:
      # Only nginx on this host should reach the backend directly.
      - "127.0.0.1:${HOST_PORT:-8012}:8012"

    env_file:
      # Runtime configuration written by scripts/setup.sh (chmod 600).
      - ${CONTAINER_DATA_DIR:-../container-data}/backend.env

    # Allow the container to reach services that listen on the host, matching
    # the host.docker.internal URLs used by backend.env examples.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - shape-shifter-network

    volumes:
      - ${CONTAINER_DATA_DIR:-../container-data}/projects:/app/projects:rw
      - ${CONTAINER_DATA_DIR:-../container-data}/shared:/app/shared:rw
      - ${CONTAINER_DATA_DIR:-../container-data}/logs:/app/logs:rw
      - ${CONTAINER_DATA_DIR:-../container-data}/output:/app/output:rw
      - ${CONTAINER_DATA_DIR:-../container-data}/backups:/app/backups:rw
      - ${CONTAINER_DATA_DIR:-../container-data}/tmp:/app/tmp:rw

      # Authorization database (SQLite). Must persist across container rebuilds.
      - ${CONTAINER_DATA_DIR:-../container-data}/state:/app/state:rw

      # PostgreSQL password file. Mounted read-only as a file, not a directory,
      # because libpq expects PGPASSFILE to point at a file.
      - ${CONTAINER_DATA_DIR:-../container-data}/.pgpass/.pgpass:/app/.pgpass:ro

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/api/v1/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  shape-shifter-network:
    driver: bridge
