version: 1

# Semantic validation rules for Shape Shifter project YAML files.
#
# These rules capture contextual and conditional constraints that the generated
# JSON Schema cannot express. Rules are grouped by category:
#
#   conditional      — rules depending on discriminator values such as type: xlsx
#   structural       — basic required-field rules important for explanation and repair
#   project_resource — file paths and external resources that must exist
#   consistency      — cross-entity reference checks
#
# Rule IDs follow the pattern: <area>.<context>.<rule_name>
# See docs/ai/semantic-rules-agent.md for format details.

rules:

  # ---------------------------------------------------------------------------
  # conditional — required options per file-loader entity type
  # ---------------------------------------------------------------------------

  - id: entity.xlsx.requires_filename
    title: xlsx entities require options.filename
    severity: error
    category: conditional
    applies_to: entities.*
    when:
      type: xlsx
    require:
      - options.filename
    message: "xlsx entities must define options.filename."
    fix: "Add options.filename pointing to the .xlsx or .xls file."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/excel_loaders.py
        symbol: PandasLoader
        note: "DriverSchema declares filename as required=True for the xlsx driver."
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: xlsx requires options.filename."

  - id: entity.openpyxl.requires_filename
    title: openpyxl entities require options.filename
    severity: error
    category: conditional
    applies_to: entities.*
    when:
      type: openpyxl
    require:
      - options.filename
    message: "openpyxl entities must define options.filename."
    fix: "Add options.filename pointing to the .xlsx file."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/excel_loaders.py
        symbol: OpenPyxlLoader
        note: "DriverSchema declares filename as required=True for the openpyxl driver."
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: openpyxl requires options.filename."

  - id: entity.csv.requires_filename
    title: csv entities require options.filename
    severity: error
    category: conditional
    applies_to: entities.*
    when:
      type: csv
    require:
      - options.filename
    message: "csv entities must define options.filename."
    fix: "Add options.filename pointing to the .csv file."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/file_loaders.py
        symbol: CsvLoader
        note: "DriverSchema declares filename as required=True for the csv driver."
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: csv requires options.filename."

  - id: entity.tsv.requires_filename
    title: tsv entities require options.filename
    severity: error
    category: conditional
    applies_to: entities.*
    when:
      type: tsv
    require:
      - options.filename
    message: "tsv entities must define options.filename."
    fix: "Add options.filename pointing to the .tsv file."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/file_loaders.py
        symbol: CsvLoader
        note: "tsv is registered as an alias for the csv loader; the same DriverSchema applies with filename required=True."
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: tsv uses the csv loader and requires options.filename."

  # ---------------------------------------------------------------------------
  # structural — required top-level fields per entity type
  # ---------------------------------------------------------------------------

  - id: entity.sql.requires_data_source
    title: sql entities require data_source
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: sql
    require:
      - data_source
    message: "sql entities must define data_source."
    fix: >-
      Add data_source referencing a name in options.data_sources, or use
      data_source: "@internal" for queries against already-processed entities.
    confidence: high
    agent_guidance:
      explanation: >
        External sql entities reference a named data source that must exist in options.data_sources.
        The special value "@internal" is the only exception — it signals that the entity queries
        already-processed entities within the same run and does not require a data_sources entry.
      repair_strategy:
        - Check options.data_sources for available data source names.
        - 'If the query reads from other entities processed in the same run, use data_source: "@internal".'
        - Do not remove data_source; add it if missing.
      safe_autofix: false
    source:
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: sql requires data_source."
      - kind: loader
        path: src/loaders/sql_loaders.py
        note: "SqlLoader validates that data_source is present at load time."

  - id: entity.sql.requires_query
    title: sql entities require query
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: sql
    require:
      - query
    message: "sql entities must define query."
    fix: "Add query with the SQL statement to execute against the configured data source."
    confidence: high
    source:
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: sql requires query."

  - id: entity.fixed.requires_columns
    title: fixed entities require columns
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: fixed
    require:
      - columns
    message: "fixed entities must define columns."
    fix: "Add columns listing the column names that match each position in the values rows."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/fixed_loader.py
        symbol: FixedLoader
        note: "FixedLoader requires columns to construct the DataFrame."
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: fixed requires columns."

  - id: entity.fixed.requires_values
    title: fixed entities require values
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: fixed
    require:
      - values
    message: "fixed entities must define values."
    fix: "Add values with a list of rows. Each row must have the same width as columns."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/fixed_loader.py
        symbol: FixedLoader
        note: "FixedLoader requires values to construct the DataFrame."
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: fixed requires values."

  - id: entity.merged.requires_branches
    title: merged entities require branches
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: merged
    require:
      - branches
    message: "merged entities must define branches."
    fix: "Add branches listing the entities to merge. Each branch requires name and source."
    confidence: high
    source:
      - kind: pydantic_model
        path: backend/app/models/entity.py
        symbol: Entity
        note: "branches field is required for merged entities in the API model."
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: merged requires branches."

  - id: entity.merged.requires_public_id
    title: merged entities require public_id
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: merged
    require:
      - public_id
    message: "merged entities must define public_id."
    fix: "Add public_id with a column name ending in _id (for example, site_id) to identify the merged entity."
    confidence: high
    source:
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: merged requires public_id."

  - id: entity.duckdb.requires_query
    title: duckdb entities require query
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: duckdb
    require:
      - query
    message: "duckdb entities must define query."
    fix: "Add query with the DuckDB SQL statement. The query can reference other already-processed entities by name."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/duckdb_loader/duckdb_loader.py
        symbol: DuckDbLoader
        note: "DuckDbLoader raises ValueError if sql_query is absent at load time."
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: duckdb requires query."

  - id: entity.duckdb.requires_depends_on
    title: duckdb entities require depends_on
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: duckdb
    require:
      - depends_on
    message: "duckdb entities must define depends_on listing the entities they query."
    fix: "Add depends_on listing every entity name referenced in the DuckDB query to ensure correct processing order."
    confidence: high
    source:
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Entity type contract table: duckdb requires depends_on."
      - kind: core
        path: src/workflow.py
        note: "Workflow builds the dependency graph from depends_on; missing entries cause incorrect processing order."

  # ---------------------------------------------------------------------------
  # project_resource — options.filename must point to an existing file
  # ---------------------------------------------------------------------------

  - id: entity.xlsx.filename_must_exist
    title: xlsx options.filename must point to an existing file
    severity: error
    category: project_resource
    applies_to: entities.*
    when:
      type: xlsx
    check:
      kind: project_file_exists
      file: options.filename
    message: "options.filename '{{ options.filename }}' does not exist."
    fix: "Check the path relative to the project file. Verify the file name and extension (.xlsx or .xls)."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/excel_loaders.py
        symbol: PandasLoader
        note: "PandasLoader raises FileNotFoundError if the file does not exist."

  - id: entity.openpyxl.filename_must_exist
    title: openpyxl options.filename must point to an existing file
    severity: error
    category: project_resource
    applies_to: entities.*
    when:
      type: openpyxl
    check:
      kind: project_file_exists
      file: options.filename
    message: "options.filename '{{ options.filename }}' does not exist."
    fix: "Check the path relative to the project file. Verify the file name and extension (.xlsx)."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/excel_loaders.py
        symbol: OpenPyxlLoader
        note: "OpenPyxlLoader raises FileNotFoundError if the file does not exist."

  - id: entity.csv.filename_must_exist
    title: csv options.filename must point to an existing file
    severity: error
    category: project_resource
    applies_to: entities.*
    when:
      type: csv
    check:
      kind: project_file_exists
      file: options.filename
    message: "options.filename '{{ options.filename }}' does not exist."
    fix: "Check the path relative to the project file. Verify the file name and extension."
    confidence: high
    source:
      - kind: loader
        path: src/loaders/file_loaders.py
        symbol: CsvLoader
        note: "CsvLoader raises FileNotFoundError if the file does not exist."

  # ---------------------------------------------------------------------------
  # consistency — cross-entity references must resolve
  # ---------------------------------------------------------------------------

  - id: reference.entity_must_exist
    title: All entity references must resolve to a defined entity
    severity: error
    category: consistency
    applies_to: entities.*
    check:
      kind: reference_resolves
      scope: entities
      fields:
        - source
        - foreign_keys[].entity
        - append[].source
        - merged.branches[].source
    message: "Entity reference '{{ value }}' does not exist in entities."
    fix: "Check the entity name for typos. Add the missing entity to the entities mapping if it is required."
    confidence: high
    source:
      - kind: instructions
        path: .github/instructions/shapeshifter-configuration.instructions.md
        note: "Dependency rules: all dependency references must point to existing entities."
      - kind: core
        path: src/workflow.py
        note: "Workflow builds a dependency graph from these references; unresolved names cause KeyError at runtime."

  # ---------------------------------------------------------------------------
  # structural + consistency — rules implemented in src/specifications
  # ---------------------------------------------------------------------------

  - id: project.metadata.requires_section
    title: Project configuration requires metadata
    severity: error
    category: structural
    applies_to: metadata
    require:
      - metadata
    message: "Project metadata section is missing."
    fix: "Add a metadata section with at least type: shapeshifter-project."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/project.py
        symbol: IsProjectSpecification

  - id: project.metadata.type_must_be_shapeshifter_project
    title: metadata.type must be shapeshifter-project
    severity: error
    category: structural
    applies_to: metadata.type
    check:
      kind: one_of
      values:
        - shapeshifter-project
    message: "Project metadata must include type: shapeshifter-project."
    fix: "Set metadata.type to shapeshifter-project."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/project.py
        symbol: IsProjectSpecification

  - id: project.circular_dependencies.not_allowed
    title: Circular dependencies are not allowed
    severity: error
    category: consistency
    applies_to: entities
    check:
      kind: acyclic_dependency_graph
      fields:
        - depends_on
        - source
    message: "Circular dependency detected in entities dependency graph."
    fix: "Remove or defer one dependency edge so the dependency graph becomes acyclic."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/project.py
        symbol: CircularDependencySpecification

  - id: project.data_source_must_exist
    title: Referenced data_source values must exist in options.data_sources
    severity: error
    category: consistency
    applies_to: entities.*
    check:
      kind: reference_resolves
      scope: options.data_sources
      fields:
        - data_source
        - append[].data_source
      allow_values:
        - "@internal"
    message: "Referenced data_source '{{ value }}' does not exist in options.data_sources."
    fix: "Add the data source under options.data_sources or use @internal when querying in-memory entities."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/project.py
        symbol: DataSourceExistsSpecification

  - id: entity.base.requires_keys
    title: entities require keys
    severity: error
    category: structural
    applies_to: entities.*
    require:
      - keys
    message: "Entities must define keys."
    fix: "Add keys as a list of business key columns used for deduplication and matching."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: EntityFieldsBaseSpecification

  - id: entity.base.requires_type
    title: entities require type
    severity: error
    category: structural
    applies_to: entities.*
    require:
      - type
    message: "Entities must define type."
    fix: "Add type with a supported entity type (for example entity, fixed, sql, merged)."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: EntityFieldsBaseSpecification

  - id: entity.base.keys_must_be_string_list
    title: keys must be a list of strings
    severity: error
    category: structural
    applies_to: entities.*.keys
    check:
      kind: type_compatible
      expected: list[string]
    message: "Entity keys must be a list of strings."
    fix: "Set keys to a YAML list containing only string column names."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: EntityFieldsBaseSpecification

  - id: entity.base.columns_must_be_string_list
    title: columns must be a list of strings when present
    severity: error
    category: structural
    applies_to: entities.*.columns
    check:
      kind: type_compatible
      expected: list[string]
    message: "Entity columns must be a list of strings when present."
    fix: "Set columns to a YAML list containing only string column names."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: EntityFieldsBaseSpecification

  - id: entity.base.type_must_be_string
    title: type must be a string
    severity: error
    category: structural
    applies_to: entities.*.type
    check:
      kind: type_compatible
      expected: string
    message: "Entity type must be a string."
    fix: "Set type to a string value."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: EntityFieldsBaseSpecification

  - id: entity.data_entity.must_not_define_data_source_or_query
    title: entity type must not define data_source or query
    severity: error
    category: conditional
    applies_to: entities.*
    when:
      type: entity
    check:
      kind: absent
      fields:
        - data_source
        - query
    message: "Non-sql data entities must not define data_source or query."
    fix: "Remove data_source/query or change type to sql."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: DataEntityFieldsSpecification

  - id: entity.sql.query_must_be_non_empty_string
    title: sql query must be a non-empty string
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: sql
    check:
      kind: not_empty
      field: query
      expected_type: string
    message: "sql entities must define query as a non-empty string."
    fix: "Set query to a non-empty SQL statement string."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: SqlEntityFieldsSpecification

  - id: entity.fixed.requires_public_id
    title: fixed entities require public_id
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: fixed
    require:
      - public_id
    message: "Fixed entities must define public_id (or surrogate_id for legacy configs)."
    fix: "Add public_id ending with _id."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: FixedEntityFieldsSpecification

  - id: entity.fixed.values_must_be_list
    title: fixed entity values must be a list
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: fixed
    check:
      kind: type_compatible
      field: values
      expected: list
    message: "Fixed entities must define values as a list."
    fix: "Set values to a list of rows (list rows or dict rows)."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: FixedEntityFieldsSpecification

  - id: entity.fixed.values_should_not_be_empty_without_append
    title: fixed entity values should not be empty when append is not used
    severity: warning
    category: structural
    applies_to: entities.*
    when:
      type: fixed
    check:
      kind: not_empty
      field: values
      unless:
        has_append: true
    message: "Fixed entities should provide non-empty values when append is not configured."
    fix: "Populate values or configure append for incoming rows."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: FixedEntityFieldsSpecification

  - id: entity.fixed.source_data_source_query_should_be_empty
    title: fixed entity source/data_source/query should be empty
    severity: warning
    category: conditional
    applies_to: entities.*
    when:
      type: fixed
    check:
      kind: empty
      fields:
        - source
        - data_source
        - query
    message: "Fixed entities should not define source, data_source, or query."
    fix: "Remove source, data_source, and query from fixed entities."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: FixedEntityFieldsSpecification

  - id: entity.fixed.values_rows_must_be_lists_or_dict_rows
    title: fixed values must use consistent row format
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: fixed
    check:
      kind: one_of
      variants:
        - list_rows
        - dict_rows
    message: "Fixed entity values must be list rows or dict rows with consistent shape."
    fix: "Use either list-of-lists or list-of-dicts consistently for all rows."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: FixedEntityFieldsSpecification

  - id: entity.fixed.values_row_length_must_match_columns
    title: fixed list rows must match expected column width
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: fixed
    check:
      kind: row_width_matches
      allowed_widths:
        - columns
        - columns_plus_identity
    message: "Fixed list rows must match columns width (data-only or with identity columns)."
    fix: "Adjust row widths to match columns or columns plus system_id/public_id."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: FixedEntityFieldsSpecification

  - id: entity.fixed.system_id_if_present_must_be_valid
    title: fixed system_id values must be non-null unique positive integers
    severity: error
    category: consistency
    applies_to: entities.*
    when:
      type: fixed
    check:
      kind: system_id_integrity
      when_column_present: system_id
      constraints:
        - non_null
        - unique
        - positive_integer
    message: "When fixed entities provide system_id, values must be non-null, unique, and positive integers."
    fix: "Correct invalid system_id values or remove system_id to let Shape Shifter auto-generate it."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: FixedEntitySystemIdSpecification

  - id: entity.merged.branches_must_be_non_empty_list
    title: merged entities require at least one branch
    severity: error
    category: structural
    applies_to: entities.*
    when:
      type: merged
    check:
      kind: not_empty
      field: branches
    message: "Merged entities must define at least one branch."
    fix: "Add one or more branch entries with name and source."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: MergedEntityFieldsSpecification

  - id: entity.merged.branch_name_and_source_required
    title: each merged branch requires name and source strings
    severity: error
    category: structural
    applies_to: entities.*.branches[]
    when:
      type: merged
    require:
      - name
      - source
    message: "Each merged branch must define non-empty name and source string fields."
    fix: "For every branch, set name and source to non-empty strings."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: MergedEntityFieldsSpecification

  - id: entity.merged.branch_name_must_be_unique
    title: merged branch names must be unique
    severity: error
    category: consistency
    applies_to: entities.*.branches[]
    when:
      type: merged
    check:
      kind: unique_within_scope
      field: name
    message: "Merged branch names must be unique within an entity."
    fix: "Rename duplicate branch names so each branch name is unique."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: MergedEntityFieldsSpecification

  - id: entity.merged.branch_source_must_exist
    title: merged branch source must reference an existing entity
    severity: error
    category: consistency
    applies_to: entities.*.branches[]
    when:
      type: merged
    check:
      kind: reference_resolves
      scope: entities
      field: source
    message: "Merged branch source '{{ value }}' does not exist in entities."
    fix: "Fix branch source name or add the missing source entity."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: MergedEntityFieldsSpecification

  - id: entity.merged.source_data_source_query_should_be_empty
    title: merged entities should not define source/data_source/query
    severity: warning
    category: conditional
    applies_to: entities.*
    when:
      type: merged
    check:
      kind: empty
      fields:
        - source
        - data_source
        - query
    message: "Merged entities should not define top-level source, data_source, or query."
    fix: "Move source references into branches and remove source/data_source/query fields."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: MergedEntityFieldsSpecification

  - id: entity.sql.columns_must_be_unique_when_configured
    title: configured sql columns must not contain duplicates
    severity: error
    category: consistency
    applies_to: entities.*
    when:
      type: sql
    check:
      kind: unique_within_scope
      field: columns
    message: "Configured sql columns contain duplicates."
    fix: "Remove duplicate entries from columns."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: SqlColumnConfigurationSpecification

  - id: entity.sql.auto_detect_disabled_requires_columns
    title: sql entities require configured columns when auto-detect is disabled
    severity: error
    category: conditional
    applies_to: entities.*
    when:
      type: sql
      auto_detect_columns: false
    require:
      - columns
    message: "When auto_detect_columns is false, sql entities must define columns."
    fix: "Add columns or enable auto_detect_columns."
    confidence: high
    source:
      - kind: specification
        path: src/specifications/entity.py
        symbol: SqlColumnConfigurationSpecification

  - id: entity.sql.auto_detect_disabled_keys_must_be_in_columns
    title: sql keys must be included in configured columns when auto-detect is disabled
    severity: error
    category: consistency
    applies_to: entities.*
    when:
      type: sql
      auto_detect_columns: false
    check:
      kind: subset
      subset: keys
      superset: columns
    message: "When auto_detect_columns is false, every key must be present in columns."
    fix: "Add missing key columns to columns or enable auto-detect."
