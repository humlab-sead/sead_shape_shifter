# Shared NGINX maps for Shape Shifter reverse-proxy vhosts.
#
# install_nginx_reverse_proxy.sh installs this file to
#   /etc/nginx/conf.d/shape-shifter-maps.conf
# so every Shape Shifter vhost shares one copy of each map.
#
# Keep the maps here, not inside a site file. Defining either map inside a
# vhost makes `nginx -t` fail with a duplicate-map error as soon as a second
# Shape Shifter site (for example test and staging) is enabled on the host.
#
# After editing this file:
#   sudo nginx -t && sudo systemctl reload nginx

# WebSocket upgrade handling for the proxied location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Authorization group membership. Basic auth has no group claim of its own, so
# the group header the backend reads is derived from the authenticated user
# name. The included membership file holds one line per member, for example:
#
#     roger    sead-admins,strucke-editors;
#
# Membership lives in /etc/nginx/authz/groups.d/. The wildcard tolerates a
# missing directory or no matching file, so the header is empty until members
# are added.
map $remote_user $authz_groups {
    default "";
    include /etc/nginx/authz/groups.d/*.conf;
}
